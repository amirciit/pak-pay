name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.0', laravel: '8.*',  testbench: '^6.0',  pest: '^1.21' }
          - { php: '8.0', laravel: '9.*',  testbench: '^7.0',  pest: '^1.21' }
          - { php: '8.1', laravel: '9.*',  testbench: '^7.0',  pest: '^2.0' }
          - { php: '8.1', laravel: '10.*', testbench: '^8.0',  pest: '^2.0' }
          - { php: '8.2', laravel: '10.*', testbench: '^8.0',  pest: '^2.0' }
          - { php: '8.2', laravel: '11.*', testbench: '^9.0',  pest: '^3.0' }
          - { php: '8.3', laravel: '11.*', testbench: '^9.0',  pest: '^3.0' }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0', pest: '^3.0' }
          - { php: '8.4', laravel: '12.*', testbench: '^10.0', pest: '^3.0' }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', pest: '^3.0' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction --dev \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: vendor/bin/pest --colors=always
